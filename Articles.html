<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles</title>
    <link rel="stylesheet" href="CSS_Articles.css">
</head>
<body>
    <div id="nav-placeholder"></div>

  fetch('Nav.html')

</script>
